(function () {
  if (window.__aeProjectFiles) return;
  window.__aeProjectFiles = true;

  var DB_NAME = 'autoeditor', PROJ = 'projects', MEDIA = 'media';
  var FORMAT = 'autoeditor-project', VERSION = 1;

  function openDB() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains(PROJ)) d.createObjectStore(PROJ, { keyPath: 'id' });
        if (!d.objectStoreNames.contains(MEDIA)) d.createObjectStore(MEDIA);
      };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  function req(r) {
    return new Promise(function (resolve, reject) {
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  function txDone(tx) {
    return new Promise(function (resolve, reject) {
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.onabort = function () { reject(tx.error); };
    });
  }
  function toDataURL(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsDataURL(blob);
    });
  }
  function newProjectId() {
    return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  async function encodeMedia(id, v) {
    if (v instanceof ArrayBuffer) v = new Blob([v]);
    if (v instanceof Blob) return { id: id, kind: 'blob', type: v.type || '', data: await toDataURL(v) };
    return { id: id, kind: 'json', value: v };
  }
  async function decodeMedia(m) {
    if (m.kind === 'blob') {
      var res = await fetch(m.data);
      return await res.blob();
    }
    return m.value;
  }

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  var statusEl = null;
  function status(msg, isErr) {
    if (!statusEl) return;
    statusEl.textContent = msg;
    statusEl.style.color = isErr ? '#fca5a5' : '#d1fae5';
  }

  async function saveProject() {
    status('Saving...');
    var db = await openDB();
    try {
      var id = new URLSearchParams(location.search).get('id');
      if (!id) {
        var all = await req(db.transaction(PROJ, 'readonly').objectStore(PROJ).getAll());
        all.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
        if (!all.length) { status('No project found yet. Add a clip in the editor, wait a second, then save.', true); return; }
        id = all[0].id;
      }
      var project = await req(db.transaction(PROJ, 'readonly').objectStore(PROJ).get(id));
      if (!project) { status('Project not found yet. Make a small change, wait a second, then save.', true); return; }
      var prefix = id + '/';
      var range = IDBKeyRange.bound(prefix, prefix + '\uffff');
      var ms = db.transaction(MEDIA, 'readonly').objectStore(MEDIA);
      var rk = ms.getAllKeys(range), rv = ms.getAll(range);
      var keys = await req(rk), vals = await req(rv);
      var media = [];
      for (var i = 0; i < keys.length; i++) {
        media.push(await encodeMedia(String(keys[i]).slice(prefix.length), vals[i]));
      }
      var payload = { format: FORMAT, version: VERSION, savedAt: new Date().toISOString(), project: project, media: media };
      var name = String(project.name || 'project').replace(/[^\w.-]+/g, '_').slice(0, 80) || 'project';
      download(new Blob([JSON.stringify(payload)], { type: 'application/json' }), name + '.autoedit.json');
      status('Saved "' + (project.name || 'project') + '" as ' + name + '.autoedit.json (' + media.length + ' media files).');
    } finally {
      db.close();
    }
  }

  async function importFile(file) {
    status('Opening ' + file.name + '...');
    var data;
    try { data = JSON.parse(await file.text()); } catch (e) { status('That file is not a valid project file.', true); return; }
    if (!data || data.format !== FORMAT || !data.project || !data.project.id) {
      status('That file is not an AutoEditor project file.', true);
      return;
    }
    var db = await openDB();
    try {
      var existing = await req(db.transaction(PROJ, 'readonly').objectStore(PROJ).get(data.project.id));
      var newId = existing ? newProjectId() : data.project.id;
      var values = [];
      var list = data.media || [];
      for (var i = 0; i < list.length; i++) {
        values.push([list[i].id, await decodeMedia(list[i])]);
      }
      var tx = db.transaction([PROJ, MEDIA], 'readwrite');
      tx.objectStore(PROJ).put(Object.assign({}, data.project, { id: newId, updatedAt: Date.now() }));
      var mstore = tx.objectStore(MEDIA);
      values.forEach(function (p) { mstore.put(p[1], newId + '/' + p[0]); });
      await txDone(tx);
      status('Project opened.');
      location.href = '/editor?id=' + encodeURIComponent(newId);
    } finally {
      db.close();
    }
  }

  function pickFile() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (f) importFile(f).catch(function (e) { status('Open failed: ' + (e && e.message || e), true); });
    };
    input.click();
  }

  function btn(label, onClick) {
    var b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('style', 'padding:8px 12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer;font:600 13px system-ui,sans-serif');
    b.onclick = function () {
      Promise.resolve().then(onClick).catch(function (e) { status('Failed: ' + (e && e.message || e), true); });
    };
    return b;
  }

  // Projects picker — the editor's "←" button calls window.__aeOpenProjects (there is no /projects page in this build).
  async function deleteProject(id) {
    var db = await openDB();
    try {
      var prefix = id + '/';
      var tx = db.transaction([PROJ, MEDIA], 'readwrite');
      tx.objectStore(PROJ).delete(id);
      tx.objectStore(MEDIA).delete(IDBKeyRange.bound(prefix, prefix + '\uffff'));
      await txDone(tx);
    } finally {
      db.close();
    }
  }
  function fmtDur(s) {
    s = Math.round(s || 0);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  async function openProjects() {
    var old = document.getElementById('ae-projects');
    if (old) old.remove();
    var db = await openDB();
    var all;
    try { all = await req(db.transaction(PROJ, 'readonly').objectStore(PROJ).getAll()); } finally { db.close(); }
    all.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    var currentId = new URLSearchParams(location.search).get('id');

    var wrap = document.createElement('div');
    wrap.id = 'ae-projects';
    wrap.setAttribute('style', 'position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font:13px system-ui,sans-serif;color:#e7e8ec');
    wrap.addEventListener('click', function (e) { if (e.target === wrap) wrap.remove(); });
    var card = document.createElement('div');
    card.setAttribute('style', 'width:min(560px,92vw);max-height:80vh;overflow:auto;background:#17171a;border:1px solid #34343a;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px');
    var head = document.createElement('div');
    head.setAttribute('style', 'display:flex;align-items:center;justify-content:space-between;gap:10px');
    head.innerHTML = '<strong style="font-size:15px">Your projects</strong>';
    var newBtn = btn('＋ New project', function () { location.href = '/editor?id=new'; });
    head.appendChild(newBtn);
    card.appendChild(head);
    if (!all.length) {
      var empty = document.createElement('div');
      empty.setAttribute('style', 'color:#8b8b94;padding:12px 0');
      empty.textContent = 'No saved projects yet. Projects save automatically while you edit.';
      card.appendChild(empty);
    }
    all.forEach(function (p) {
      var row = document.createElement('div');
      row.setAttribute('style', 'display:flex;align-items:center;gap:12px;padding:8px;border:1px solid ' + (p.id === currentId ? '#8b8b94' : '#26262c') + ';border-radius:10px;background:#202024');
      var th = document.createElement('div');
      th.setAttribute('style', 'width:96px;height:54px;border-radius:6px;background:#101012 center/cover no-repeat;flex:none' + (p.thumb ? ';background-image:url(' + p.thumb + ')' : ''));
      var info = document.createElement('div');
      info.setAttribute('style', 'flex:1;min-width:0');
      var when = p.updatedAt ? new Date(p.updatedAt).toLocaleString() : '';
      info.innerHTML = '<div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><div style="color:#8b8b94;font-size:12px"></div>';
      info.children[0].textContent = (p.name || 'Untitled project') + (p.id === currentId ? ' (open)' : '');
      info.children[1].textContent = (p.clipCount || 0) + ' clips · ' + fmtDur(p.durationSec) + (when ? ' · ' + when : '');
      var open = btn('Open', function () { location.href = '/editor?id=' + encodeURIComponent(p.id); });
      var del = btn('Delete', async function () {
        if (!confirm('Delete "' + (p.name || 'Untitled project') + '"? This cannot be undone.')) return;
        await deleteProject(p.id);
        if (p.id === currentId) location.href = '/editor?id=new'; else openProjects();
      });
      del.style.borderColor = '#7f1d1d';
      row.appendChild(th); row.appendChild(info); row.appendChild(open); row.appendChild(del);
      card.appendChild(row);
    });
    wrap.appendChild(card);
    document.body.appendChild(wrap);
  }
  window.__aeOpenProjects = function () {
    openProjects().catch(function (e) { status('Could not list projects: ' + (e && e.message || e), true); });
  };

  function mount() {
    var box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;right:12px;bottom:12px;z-index:2147483000;display:flex;flex-direction:column;align-items:flex-end;gap:6px');
    statusEl = document.createElement('div');
    statusEl.setAttribute('style', 'max-width:420px;font:12px system-ui,sans-serif;background:rgba(15,23,42,.9);padding:4px 8px;border-radius:6px;display:none');
    var row = document.createElement('div');
    row.setAttribute('style', 'display:flex;gap:8px');
    row.appendChild(btn('Projects', function () { return openProjects(); }));
    row.appendChild(btn('Save project file', saveProject));
    row.appendChild(btn('Open project file', function () { pickFile(); }));
    box.appendChild(statusEl);
    box.appendChild(row);
    document.body.appendChild(box);
    var origStatus = status;
    status = function (msg, isErr) { statusEl.style.display = 'block'; origStatus(msg, isErr); };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script></body></html>
